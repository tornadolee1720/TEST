<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no" />
  <meta name="theme-color" content="#07111c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="打開手機前鏡頭，讓雙手在空中彈奏發光琴弦。無需安裝 App。" />
  <title>Air Strings｜手機空中光弦實驗室 V3</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="stage">
    <canvas id="scene" aria-label="即時雙手追蹤與空中光弦"></canvas>
    <header class="hud">
      <div class="brand"><span class="eyebrow">UNCLE GLASSES · CREATIVE LAB</span><h1>空中光弦 <small>MOBILE V4</small></h1></div>
      <div class="metrics"><span id="status">尚未啟動</span><span id="hands">手部 0 / 2</span><span id="fps">FPS --</span><span id="mode">待機</span></div>
    </header>
    <section id="welcome" class="welcome" role="dialog" aria-label="空中光弦啟動">
      <div class="welcome-inner">
        <div class="pill">免安裝 · 手機前鏡頭 · 即時互動</div>
        <h2>把手伸進鏡頭。<br/><em>空氣，就會發光。</em></h2>
        <p>把雙手放進鏡頭，<strong>用食指或中指掃過光弦</strong>就能發聲，捏合再放開也能彈響。雙手同時進鏡頭，還能拉出更漂亮的琴弦。</p>
        <div class="actions"><button id="start">📷 開啟鏡頭，開始玩</button><button id="demo" class="secondary">先看展示模式</button></div>
        <p class="tiny">第一次會詢問相機權限，模型需要連網下載。相機影格在本機辨識、不由本站上傳；第三方 MediaPipe 可能收集 SDK 使用統計。</p>
        <p class="tiny" id="secureHint"></p>
        <p class="error" id="error" role="alert"></p>
      </div>
    </section>
    <footer id="controls" class="controls hidden">
      <div class="guide" id="help">張開雙手 · 食指掃過光弦，或捏合再放開</div>
      <div class="toolbar">
        <label class="tool-toggle"><input id="showCam" type="checkbox" checked /><span>真人</span></label>
        <label class="tool-toggle"><input id="showPoints" type="checkbox" checked /><span>節點</span></label>
        <label class="vol"><span>音量</span><input id="volume" type="range" min="0" max="100" value="55" aria-label="音量" /></label>
        <label class="quality-label">效能<select id="quality" aria-label="畫面效能"><option value="auto">自動</option><option value="eco">省電</option><option value="smooth">流暢</option></select></label><button id="lockStrings" class="small lock-strings" type="button" aria-pressed="false">📌 固定琴弦</button><button id="flip" class="small">切鏡頭</button><button id="share" class="small">分享</button>
        <button id="shot" class="small">拍照</button>
        <button id="stop" class="small">結束</button>
      </div>
    </footer>
  </main>
  <video id="camera" autoplay muted playsinline style="display:none"></video>
  <script defer src="app.js"></script>
</body>
</html>
